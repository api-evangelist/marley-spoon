name: Marley Spoon
description: >-
  Marley Spoon is a direct-to-consumer meal-kit and grocery company that delivers
  weekly recipe boxes with pre-portioned ingredients to households, operating the
  Marley Spoon and Dinnerly brands across markets in the United States, Australia,
  and Europe. It runs a consumer web and mobile storefront for menu selection,
  subscription management, and delivery; there is no public developer portal, API
  documentation, or partner API program. The company's public GitHub organization
  hosts only a few internal Ruby infrastructure forks (no client SDKs or specs).
  Enrichment surfaced no API surface: no /.well-known discovery documents, no
  security.txt, and no llms.txt. This profile was added to the API Evangelist
  network as a VC-portfolio lead and remains a company stub with security/identity
  signals probed rather than an active API provider.
